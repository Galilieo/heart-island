@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes lean{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes drip{0%{opacity:0;transform:translateY(-1px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(3.5px)}}
@keyframes zup{0%{opacity:0;transform:translate(0,2px) scale(.8)}30%{opacity:1}100%{opacity:0;transform:translate(1.5px,-4px) scale(1.1)}}
@keyframes hup{0%{opacity:0;transform:translateY(3px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-6px) scale(1.05)}}
@keyframes dot{0%,100%{opacity:.25}35%{opacity:1}}
@keyframes appear{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@keyframes pop{0%,45%,100%{transform:scale(1)}10%{transform:scale(.3)}22%{transform:scale(1.25)}32%{transform:scale(.95)}}
@keyframes pulsepop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes qbob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-1px) rotate(6deg)}}
@keyframes perk{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}
.xy-touched .char,.xy-touched .sprout,.xy-touched .leaves,.xy-touched .eyes,.xy-touched .wave{transform-box:view-box}.xy-touched .char{transform-origin:32px 54px}.xy-touched .sprout{transform-origin:32px 29px}.xy-touched .leaves{transform-origin:32px 22.6px}.xy-touched .eyes{transform-origin:32px 41.5px}.xy-touched .tw1,.xy-touched .tw2,.xy-touched .pop,.xy-touched .pulse-pop,.xy-touched .qbob,.xy-touched .hup,.xy-touched .zup,.xy-touched .glow{transform-box:fill-box;transform-origin:center}.xy-touched .tw1{animation:twinkle 1.6s ease-in-out infinite}.xy-touched .tw2{animation:twinkle 1.6s ease-in-out .8s infinite}.xy-touched .drip{animation:drip 1.8s ease-in infinite}.xy-touched .drip.slow{animation-duration:2.6s}.xy-touched .zup{animation:zup 2.6s ease-out infinite}.xy-touched .zup.late{animation-delay:1.3s}.xy-touched .hup{animation:hup 2.4s ease-out infinite}.xy-touched .hup.late{animation-delay:1.2s}.xy-touched .d1,.xy-touched .d2,.xy-touched .d3{animation:dot 1.2s ease-in-out infinite}.xy-touched .d2{animation-delay:.2s}.xy-touched .d3{animation-delay:.4s}.xy-touched .a1,.xy-touched .a2,.xy-touched .a3{animation:appear 2.4s ease-out infinite}.xy-touched .a2{animation-delay:.25s}.xy-touched .a3{animation-delay:.5s}.xy-touched .pop{animation:pop 1.8s ease-out infinite}.xy-touched .pulse-pop{animation:pulsepop .9s ease-in-out infinite}.xy-touched .pulse{animation:pulse 1.8s ease-in-out infinite}.xy-touched .shimmer{animation:pulse 1.6s ease-in-out infinite}.xy-touched .glow{animation:glow 3s ease-in-out infinite}.xy-touched .qbob{animation:qbob 2.2s ease-in-out infinite}.xy-touched .wave{animation:wave 3s ease-in-out infinite}.xy-touched .char{animation:bobslow 3.5s ease-in-out infinite}.xy-touched .sprout{animation:swaysm 3.5s ease-in-out infinite}.xy-touched .eyes{animation:blink 4s ease-in-out infinite}.xy-touched .ws{display:none}@media (prefers-reduced-motion:reduce){.xy-touched *{animation:none!important}.xy-touched .wm{display:none!important} .xy-touched .