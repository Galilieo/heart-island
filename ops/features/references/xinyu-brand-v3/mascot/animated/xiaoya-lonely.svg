<svg xmlns="http://www.w3.org/2000/svg" class="xy-lonely" viewBox="0 0 64 64"><style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9px)}}
@keyframes bobslow{0%,100%{transform:translateY(.2px)}50%{transform:translateY(-.5px)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(.45px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes swaysm{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes tremble{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.05,.94)}42%{transform:translateY(-2.2px) scale(.97,1.04)}66%{transform:translateY(0) scale(1.03,.97)}82%{transform:translateY(0) scale(1,1)}}
@keyframes jump{0%,45%,100%{transform:translateY(0) scale(1,1)}8%{transform:translateY(0) scale(1.06,.93)}18%{transform:translateY(-2.4px) scale(.96,1.05)}30%{transform:translateY(0) scale(1.04,.96)}38%{transform:translateY(0) scale(1,1)}}
@keyframes shake{0%,50%,100%{transform:translateX(0)}8%,24%,40%{transform:translateX(-.7px)}16%,32%{transform:translateX(.7px)}}
@keyframes jitter{0%,100%{transform:translateX(0)}25%{transform:translateX(-.35px)}75%{transform:translateX(.35px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes lean{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes drip{0%{opacity:0;transform:translateY(-1px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(3.5px)}}
