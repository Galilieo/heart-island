spring:
  application:
    name: xinyu-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/xinyu?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 约束连接获取／验证及JDBC网络读取；5秒事务超时本身不覆盖这些阶段。
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2000
        socketTimeout: 6000
  data:
    redis:
      # 留空时只用本机进程内计数，应用照常启动（本机开发默认）。
      url: ${REDIS_URL:}

server:
  forward-headers-strategy: framework

xinyu:
  review:
    # 回顾统计的自然周和近 30 天都按这个时区的墙上时间计算。
    time-zone: Asia/Shanghai
  rate-limit:
    # 付费 AI 调用的时间窗口额度（阶段 1b）；窗口按整点和自然日对齐。
    # key-prefix 含冒号，必须带引号。
    enabled: true
    key-prefix: "xinyu:dev:"
    redis-timeout: 200ms
    fallback-cooldown: 30s
    mood-per-hour: 20
    mood-per-day: 100
    community-per-hour: 10
    review-per-day: 10
    global-per-hour: 1000

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-v4-flash

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
