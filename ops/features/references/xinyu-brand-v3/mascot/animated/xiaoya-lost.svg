<svg xmlns="http://www.w3.org/2000/svg" class="xy-lost" viewBox="0 0 64 64"><style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9px)}}
@keyframes bobslow{0%,100%{transform:translateY(.2px)}50%{transform:translateY(-.5px)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(.45px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes swaysm{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes tremble{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.05,.94)}42%{transform:translateY(-2.2px) scale(.97,1.04)}66%{transform:translateY(0) scale(1.03,.97)}82%{transform:translateY(0) scale(1,1)}}
@keyframes jump{0%,45%,100%{transform:translateY(0) scale(1,1)}8%{transform:translateY(0) scale(1.06,.93)}18%{transform:translateY(-2.4px) scale(.96,1.05)}30%{transform:translateY(0) scale(1.04,.96)}38%{transform:translateY(0) scale(1,1)}}
@keyframes shake{0%,50%,100%{transform:translateX(0)}8%,24%,40%{transform:translateX(-.7px)}16%,32%{transform:translateX(.7px)}}
@keyframes jitter{0%,100%{transform:translateX(0)}25%{transform:translateX(-.35px)}75%{transform:translateX(.35px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes lean{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes drip{0%{opacity:0;transform:translateY(-1px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(3.5px)}}
@keyframes zup{0%{opacity:0;transform:translate(0,2px) scale(.8)}30%{opacity:1}100%{opacity:0;transform:translate(1.5px,-4px) scale(1.1)}}
@keyframes hup{0%{opacity:0;transform:translateY(3px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-6px) scale(1.05)}}
@keyframes dot{0%,100%{opacity:.25}35%{opacity:1}}
@keyframes appear{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@keyframes pop{0%,45%,100%{transform:scale(1)}10%{transform:scale(.3)}22%{transform:scale(1.25)}32%{transform:scale(.95)}}
@keyframes pulsepop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes qbob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-1px) rotate(6deg)}}
@keyframes perk{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}

@keyframes tiptoe{0%,55%,100%{transform:translateY(0) scale(1,1)}62%{transform:translateY(0) scale(1.03,.97)}70%{transform:translateY(-1.6px) scale(.98,1.02)}78%{transform:translateY(0) scale(1,1)}84%{transform:translateY(-.8px)}90%{transform:translateY(0)}}
@keyframes sniff{0%,60%,100%{transform:translateY(0) scale(1,1)}66%{transform:translateY(.3px) scale(1.02,.975)}72%{transform:translateY(-.2px) scale(.99,1.01)}78%{transform:translateY(0) scale(1,1)}}
@keyframes look{0%,100%{transform:rotate(0)}15%,35%{transform:rotate(-3.5deg)}55%,75%{transform:rotate(3.5deg)}}
@keyframes flyaway{0%{opacity:0;transform:translate(-2px,2px)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(5px,-4px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes quiver{0%,58%,100%{transform:translateY(0)}68%{transform:translateY(.6px)}78%{transform:translateY(.1px)}86%{transform:translateY(.35px)}}
.xy-lost .char,.xy-lost .sprout,.xy-lost .leaves,.xy-lost .eyes,.xy-lost .wave{transform-box:view-box}.xy-lost .char{transform-origin:32px 54px}.xy-lost .sprout{transform-origin:32px 29px}.xy-lost .leaves{transform-origin:32px 22.6px}.xy-lost .eyes{transform-origin:32px 41.5px}.xy-lost .tw1,.xy-lost .tw2,.xy-lost .pop,.xy-lost .pulse-pop,.xy-lost .qbob,.xy-lost .hup,.xy-lost .zup,.xy-lost .glow{transform-box:fill-box;transform-origin:center}.xy-lost .tw1{animation:twinkle 1.6s ease-in-out infinite}.xy-lost .tw2{animation:twinkle 1.6s ease-in-out .8s infinite}.xy-lost .drip{animation:drip 1.8s ease-in infinite}.xy-lost .drip.slow{animation-duration:2.6s}.xy-lost .zup{animation:zup 2.6s ease-out infinite}.xy-lost .zup.late{animation-delay:1.3s}.xy-lost .hup{animation:hup 2.4s ease-out infinite}.xy-lost .hup.late{animation-delay:1.2s}.xy-lost .d1,.xy-lost .d2,.xy-lost .d3{animation:dot 1.2s ease-in-out infinite}.xy-lost .d2{animation-delay:.2s}.xy-lost .d3{animation-delay:.4s}.xy-lost .a1,.xy-lost .a2,.xy-lost .a3{animation:appear 2.4s ease-out infinite}.xy-lost .a2{animation-delay:.25s}.xy-lost .a3{animation-delay:.5s}.xy-lost .pop{animation:pop 1.8s ease-out infinite}.xy-lost .pulse-pop{animation:pulsepop .9s ease-in-out infinite}.xy-lost .pulse{animation:pulse 1.8s ease-in-out infinite}.xy-lost .shimmer{animation:pulse 1.6s ease-in-out infinite}.xy-lost .glow{animation:glow 3s ease-in-out infinite}.xy-lost .qbob{animation:qbob 2.2s ease-in-out infinite}.xy-lost .wave{animation:wave 3s ease-in-out infinite}.xy-lost .fly,.xy-lost .flap,.xy-lost .quiver{transform-box:fill-box;transform-origin:center}.xy-lost .fly{animation:flyaway 6s ease-in-out infinite}.xy-lost .fly.late{animation-delay:-3s}.xy-lost .flap{animation:flap .7s ease-in-out infinite}.xy-lost .quiver{animation:quiver 3.2s ease-in-out infinite}.xy-lost .char{animation:look 4s ease-in-out infinite}.xy-lost .sprout{animation:swaysm 2.6s ease-in-out infinite}.xy-lost .eyes{animation:blink 4s ease-in-out infini