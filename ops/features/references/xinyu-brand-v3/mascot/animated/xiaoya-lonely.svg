@keyframes sniff{0%,60%,100%{transform:translateY(0) scale(1,1)}66%{transform:translateY(.3px) scale(1.02,.975)}72%{transform:translateY(-.2px) scale(.99,1.01)}78%{transform:translateY(0) scale(1,1)}}
@keyframes look{0%,100%{transform:rotate(0)}15%,35%{transform:rotate(-3.5deg)}55%,75%{transform:rotate(3.5deg)}}
@keyframes flyaway{0%{opacity:0;transform:translate(-2px,2px)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(5px,-4px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes quiver{0%,58%,100%{transform:translateY(0)}68%{transform:translateY(.6px)}78%{transform:translateY(.1px)}86%{transform:translateY(.35px)}}
.xy-lonely .char,.xy-lonely .sprout,.xy-lonely .leaves,.xy-lonely .eyes,.xy-lonely .wave{transform-box:view-box}.xy-lonely .char{transform-origin:32px 54px}.xy-lonely .sprout{transform-origin:32px 29px}.xy-lonely .leaves{transform-origin:32px 22.6px}.xy-lonely .eyes{transform-origin:32px 41.5px}.xy-lonely .tw1,.xy-lonely .tw2,.xy-lonely .pop,.xy-lonely .pulse-pop,.xy-lonely .qbob,.xy-lonely .hup,.xy-lonely .zup,.xy-lonely .glow{transform-box:fill-box;transform-origin:center}.xy-lonely .tw1{animation:twinkle 1.6s ease-in-out infinite}.xy-lonely .tw2{animation:twinkle 1.6s ease-in-out .8s infinite}.xy-lonely .drip{animation:drip 1.8s ease-in infinite}.xy-lonely .drip.slow{animation-duration:2.6s}.xy-lonely .zup{animation:zup 2.6s ease-out infinite}.xy-lonely .zup.late{animation-delay:1.3s}.xy-lonely .hup{animation:hup 2.4s ease-out infinite}.xy-lonely .hup.late{animation-delay:1.2s}.xy-lonely .d1,.xy-lonely .d2,.xy-lonely .d3{animation:dot 1.2s ease-in-out infinite}.xy-lonely .d2{animation-delay:.2s}.xy-lonely .d3{animation-delay:.4s}.xy-lonely .a1,.xy-lonely .a2,.xy-lonely .a3{animation:appear 2.4s ease-out infinite}.xy-lonely .a2{animation-delay:.25s}.xy-lonely .a3{animation-delay:.5s}.xy-lonely .pop{animation:pop 1.8s ease-out infinite}.xy-lonely .pulse-pop{animation:pulsepop .9s ease-in-out infinite}.xy-lonely .pulse{animation:pulse 1.8s ease-in-out infinite}.xy-lonely .shimmer{animation:pulse 1.6s ease-in-out infinite}.xy-lonely .glow{animation:glow 3s ease-in-out infinite}.xy-lonely .qbob{animation:qbob 2.2s ease-in-out infinite}.xy-lonely .wave{animation:wave 3s ease-in-out infinite}.xy-lonely .fly,.xy-lonely .flap,.xy-lonely .quiver{transform-box:fill-box;transform-origin:center}.xy-lonely .fly{animation:flyaway 6s ease-in-out infinite}.xy-lonely .fly.late{animation-delay:-3s}.xy-lonely .flap{animation:flap .7s ease-in-out infinite}.xy-lonely .quiver{animation:quiver 3.2s ease-in-out infinite}.xy-lonely .char{animation:breathe 5s ease-in-out infinite}.xy-lonel