spring:
  application:
    name: xinyu-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/xinyu?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 约束连接获取／验证及JDBC网络读取；5秒事务超时本身不覆盖这些阶段。
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2000
        socketTimeout: 6000

server:
  forward-headers-strategy: framework

xinyu:
  review:
    # 回顾统计的自然周和近 30 天都按这个时区的墙上时间计算。
    time-zone: Asia/Shanghai

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-v4-flash

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
