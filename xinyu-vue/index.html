    <style>
      :root { --site-filing-height: 68px; }
      body { margin: 0; }
      /* 登录页与静态备案区共用背景，避免页脚出现独立色带。 */
      body:has(#app .auth) {
        background:
          radial-gradient(circle at 22% 24%, rgba(111, 169, 164, 0.20), transparent 46%),
          radial-gradient(circle at 82% 70%, rgba(217, 140, 122, 0.14), transparent 50%),
          radial-gradient(circle at 60% 8%, rgba(243, 185, 95, 0.10), transparent 42%),
          linear-gradient(135deg, var(--bg-warm-from) 0%, var(--bg-warm-mid) 55%, var(--bg-warm-to) 100%);
        background-attachment: fixed;
      }
      #app .auth { background: transparent; }
      #app {
        min-height: calc(100vh - var(--site-filing-height));
        min-height: calc(100dvh - var(--site-filing-height));
      }
      .site-filing {
        box-sizing: border-box;
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px 20px;
        min-height: var(--site-filing-height);
        padding: 12px 16px;
        color: var(--ink-3, #746f63);
        font: 12px/20px system-ui, sans-serif;
      }
      .site-filing a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
      }
      .site-filing a:hover { text-decoration: underline; }
      .site-filing img {
        display: block;
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      @media (max-width: 768px) {
        body:has(.shell--with-nav) {
          padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
        }
        body:has(.shell--with-nav) #app .shell {
          min-height: calc(100dvh - var(--site-filing-height) - 64px - env(safe-area-inset-bottom, 0px));
        }
      }
      @media (max-width: 600px) {
        :root { --site-filing-height: 118px; }
        .site-filing { flex-direction: column; }
      }
