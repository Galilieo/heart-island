@keyframes sniff{0%,60%,100%{transform:translateY(0) scale(1,1)}66%{transform:translateY(.3px) scale(1.02,.975)}72%{transform:translateY(-.2px) scale(.99,1.01)}78%{transform:translateY(0) scale(1,1)}}
@keyframes look{0%,100%{transform:rotate(0)}15%,35%{transform:rotate(-3.5deg)}55%,75%{transform:rotate(3.5deg)}}
@keyframes flyaway{0%{opacity:0;transform:translate(-2px,2px)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(5px,-4px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes quiver{0%,58%,100%{transform:translateY(0)}68%{transform:translateY(.6px)}78%{transform:translateY(.1px)}86%{transform:translateY(.35px)}}
.xy-hopeful .char,.xy-hopeful .sprout,.xy-hopeful .leaves,.xy-hopeful .eyes,.xy-hopeful .wave{transform-box:view-box}.xy-hopeful .char{transform-origin:32px 54px}.xy-hopeful .sprout{transform-origin:32px 29px}.xy-hopeful .leaves{transform-origin:32px 22.6px}.xy-hopeful .eyes{transform-origin:32px 41.5px}.xy-hopeful .tw1,.xy-hopeful .tw2,.xy-hopeful .pop,.xy-hopeful .pulse-pop,.xy-hopeful .qbob,.xy-hopeful .hup,.xy-hopeful .zup,.xy-hopeful .glow{transform-box:fill-box;transform-origin:center}.xy-hopeful .tw1{animation:twinkle 1.6s ease-in-out infinite}.xy-hopeful .tw2{animation:twinkle 1.6s ease-in-out .8s infinite}.xy-hopeful .drip{animation:drip 1.8s ease-in infinite}.xy-hopeful .drip.slow{animation-duration:2.6s}.xy-hopeful .zup{animation:zup 2.6s ease-out infinite}.xy-hopeful .zup.late{animation-delay:1.3s}.xy-hopeful .hup{animation:hup 2.4s ease-out infinite}.xy-hopeful .hup.late{animation-delay:1.2s}.xy-hopeful .d1,.xy-hopeful .d2,.xy-hopeful .d3{animation:dot 1.2s ease-in-out infinite}.xy-hopeful .d2{animation-delay:.2s}.xy-hopeful .d3{animation-delay:.4s}.xy-hopeful .a1,.xy-hopeful .a2,.xy-hopeful .a3{animation:appear 2.4s ease-out infinite}.xy-hopeful .a2{animation-delay:.25s}.xy-hopeful .a3{animation-delay:.5s}.xy-hopeful .pop{animation:pop 1.8s ease-out infinite}.xy-hopeful .pulse-pop{animation:pulsepop .9s ease-in-out infinite}.xy-hopeful .pulse{animation:pulse 1.8s ease-in-out infinite}.xy-hopeful .shimmer{animation:pulse 1.6s ease-in-out infinite}.xy-hopeful .glow{animation:glow 3s ease-in-out infinite}.xy-hopeful .qbob{animation:qbob 2.2s ease-in-out infinite}.xy-hopeful .wave{animation:wave 3s ease-in-out infinite}.xy-hopeful .fly,.xy-hopeful .flap,.xy-hopeful .quiver{transform-box:fill-box;transform-origin:center}.xy-hopeful .fly{animation:flyaway 6s ease-in-out infinite}.xy-hopeful .fly.late{animation-delay:-3s}.xy-hopeful .flap{animation:flap .7s ease-in-out infinite}.xy-hopeful .quiver{animation:quiver 3.2s ease-in-out infinite}.xy-hopeful .char{a