@keyframes hup{0%{opacity:0;transform:translateY(3px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-6px) scale(1.05)}}
@keyframes dot{0%,100%{opacity:.25}35%{opacity:1}}
@keyframes appear{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
