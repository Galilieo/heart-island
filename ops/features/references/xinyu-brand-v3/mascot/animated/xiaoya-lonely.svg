@keyframes pulsepop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes qbob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-1px) rotate(6deg)}}
@keyframes perk{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}

