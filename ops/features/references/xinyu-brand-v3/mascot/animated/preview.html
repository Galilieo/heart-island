<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小芽 动态表情预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fdfaf3;color:#2f2a24;font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;padding:32px 16px 48px}
main{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}p.lead{color:#6b6357;margin:0;font-size:14px;line-height:1.6}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0;background:#fff;border:1px solid #ece3d2;border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
figure img{width:120px;height:120px}figcaption{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#6b6357}figcaption b{font-size:15px;color:#2f2a24}
code{color:#2f5d58;background:#eef5f2;border-radius:6px;padding:2px 6px;font-size:11px}
.panel{background:#fff;border:1px solid #ece3d2;border-radius:20px;padding:22px 24px}
.demo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}@media(max-width:820px){.demo{grid-template-columns:1fr}}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.mood{display:flex;align-items:center;gap:4px;border:1px solid #ece3d2;background:#fff;border-radius:14px;padding:4px 12px 4px 4px;font:inherit;font-size:14px;color:#2f2a24;cursor:pointer}
.mood img{width:36px;height:36px}.mood[aria-pressed=true]{border:2px solid #f3b95f;background:#fdecca;font-weight:600;padding:3px 11px 3px 3px}
.big{display:flex;align-items:center;gap:16px;margin-top:16px;min-height:110px}.big img{width:100px;height:100px}.big span{color:#6b6357;font-size:14px}
.chat{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:12px;align-items:flex-start}.row.me{justify-content:flex-end}
.av{width:48px;height:48px;border-radius:50%;background:#e4f0ee;flex-shrink:0}.av.t{background:none;border-radius:0}
.bub{background:#f6efe1;border-radius:4px 16px 16px 16px;padding:11px 15px;font-size:14px;line-height:1.6;max-width:80%}.me .bub{background:#dcebe6;border-radius:16px 4px 16px 16px}.bub.wait{color:#6b6357}
.btn{margin-top:14px;font:inherit;font-size:13px;border:1px solid #2f5d58;color:#2f5d58;background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer}
.hello{border-radius:22px;padding:22px 28px;background:linear-gradient(110deg,#e4eeec,#efe8e3 60%,#f3e3de);display:flex;align-items:center;justify-content:space-between;gap:16px}
.hello small{font-size:12px;letter-spacing:.2em;color:#4f7f78;font-weight:600}.hello b{display:block;font-size:30px;margin:6px 0}.hello span{color:#6b6357}.hello img{width:100px;height:100px;flex-shrink:0}
.sizes{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}.sizes div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#6b6357}
.dark{background:#0f2228;border-radius:20px;padding:20px 24px;display:flex;align-items:center;gap:20px;color:#cfdcd7;font-size:14px}.dark img{width:120px;height:120px}.dark code{background:#1d3a40;color:#bfe0d6}</style></head>
